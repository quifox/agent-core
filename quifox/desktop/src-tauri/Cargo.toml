[package]
name = "quifox-desktop"
version = "0.1.0"
description = "QuiFox shared Agent desktop host"
edition = "2021"
license = "MIT"

[lib]
name = "quifox_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
