<polyline points="565,315 565,390" fill="none" stroke="#6352cc" stroke-width="2" marker-end="url(#end)"/>
<polyline points="890,315 890,390" fill="none" stroke="#6352cc" stroke-width="2" marker-end="url(#end)"/>
