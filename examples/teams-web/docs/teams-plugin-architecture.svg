<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="end" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1600" height="880" rx="16" fill="#f6f6fa" stroke="#f6f6fa" stroke-width="1.5"/>
<text x="50" y="64" font-size="34" fill="#24283c" text-anchor="start"><tspan x="50" dy="0">用插件组合团队协作</tspan></text>
<text x="50" y="101" font-size="19" fill="#6c7287" text-anchor="start"><tspan x="50" dy="0">四个普通 Agent：独立会话与专家提示词，共享 Teams；事件由服务端推送给 Web。</tspan></text>
