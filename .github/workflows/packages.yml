name: QuiFox packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['quifox-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            bundles: deb
          - runner: macos-latest
            platform: macos-arm64
            bundles: dmg
          - runner: windows-2022
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build CLI
        working-directory: quifox/tui
        run: bun run binary:build
      - name: CLI smoke
        shell: bash
        run: |
          cli_path=quifox/release/bin/quifox
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli_path+=.exe; fi
          "$cli_path" --version
          "$cli_path" --help
      - name: Build npm TUI bundle
        working-directory: quifox/tui
        run: bun run npm:build
      - name: Pack npm TUI
        working-directory: quifox/release/npm/quifox
        run: npm pack --ignore-scripts --pack-destination ..
      - name: Verify npm installation
        working-directory: quifox/tui
        run: bun run test -- test/npm.test.ts
      - name: Build desktop installer
        working-directory: quifox/desktop
        run: bun run desktop:build -- --verbose --bundles ${{ matrix.bundles }}
      - name: Verify packaged Linux engine bytes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          desktop_deb=$(find quifox/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb --extract "$desktop_deb" "$RUNNER_TEMP/quifox-deb-check"
          cmp quifox/desktop/src-tauri/binaries/quifox-engine-x86_64-unknown-linux-gnu "$RUNNER_TEMP/quifox-deb-check/usr/bin/quifox-engine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quifox-${{ matrix.platform }}
          path: |
            quifox/desktop/src-tauri/target/release/bundle/**/*.dmg
            quifox/desktop/src-tauri/target/release/bundle/**/*.deb
            quifox/desktop/src-tauri/target/release/bundle/**/*.exe
            quifox/release/bin/*
            quifox/release/npm/*.tgz
            quifox/release/licenses/**
          if-no-files-found: error
          retention-days: 14
